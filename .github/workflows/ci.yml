name: Firmware & host tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C parsers and LCD renderer (ASan + UBSan)
        run: python3 tools/test_host.py

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32c3
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32c3-iine-gamepad-app
          path: build/iine_gamepad_demo.bin
          if-no-files-found: error
